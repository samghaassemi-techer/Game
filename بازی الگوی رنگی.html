<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازی الگوی رنگی</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#222;--muted:#666;--line:#d8d6cf;--ok:#2e7d32;--warn:#b26a00;--bad:#c62828}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#2a2a27;--text:#eee;--muted:#aaa;--line:#4a4a45;--ok:#81c784;--warn:#ffb74d;--bad:#ef9a9a}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:520px}
h1{font-size:20px;font-weight:600;margin:0 0 6px}
p.hint{font-size:14px;color:var(--muted);margin:0 0 14px}
#pal{display:flex;gap:8px;margin:0 0 12px;direction:ltr;justify-content:center;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:8px;cursor:pointer;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);background:var(--card)}
.sw.on{border:3px solid var(--text)}
#board{direction:ltr;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.row{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));margin-bottom:8px}
.row.gap{margin-bottom:16px}
.row.free{border-top:1px dashed var(--line);padding-top:10px}
.cell{aspect-ratio:1;border:1px solid var(--line);cursor:pointer;touch-action:manipulation}
.cell.lock{cursor:default}
.cell.wrong{outline:2px solid var(--bad);outline-offset:-2px}
#msg{font-size:15px;font-weight:600;min-height:28px;margin:14px 0 8px}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:15px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
<h1>بازی الگوی رنگی</h1>
<p class="hint">یک رنگ انتخاب کن و الگوی هر ردیف را ادامه بده. ردیف آخر آزاد است؛ الگوی خودت را بساز.</p>
<div id="pal"></div>
<div id="board"></div>
<div id="msg"></div>
<div class="btns">
<button id="chk">بررسی</button>
<button id="rst">از اول</button>
</div>
</main>
<script>
var C={R:'#E24B4A',G:'#4CAF50',Y:'#F6D32D',B:'#378ADD',P:'#ED93B1'};
var N=14;
var defs=[
{p:'RRGG',pre:8},
{p:'YYYBB',pre:10},
{p:'GGGGP',pre:10},
{p:'RPP',pre:9},
{p:'',pre:0}
];
var cur='R',st=[],locked=[];
function exp(r,i){var p=defs[r].p;return p?p[i%p.length]:'';}
function init(){
st=[];locked=[];
defs.forEach(function(d,r){
var a=[],l=[];
for(var i=0;i<N;i++){if(i<d.pre){a.push(exp(r,i));l.push(true);}else{a.push('');l.push(false);}}
st.push(a);locked.push(l);
});
draw();
document.getElementById('msg').textContent='';
}
function draw(wrong){
var b=document.getElementById('board');b.innerHTML='';
st.forEach(function(row,r){
var g=document.createElement('div');
g.className='row'+(r==3?' gap':'')+(r==4?' free':'');
row.forEach(function(c,i){
var d=document.createElement('div');
d.className='cell'+(locked[r][i]?' lock':'')+(wrong&&wrong[r+'_'+i]?' wrong':'');
if(c)d.style.background=C[c];
if(!locked[r][i])d.onclick=function(){st[r][i]=(st[r][i]==cur?'':cur);draw();};
g.appendChild(d);
});
b.appendChild(g);
});
}
function pal(){
var p=document.getElementById('pal');p.innerHTML='';
Object.keys(C).concat(['']).forEach(function(k){
var s=document.createElement('div');
s.className='sw'+(cur==k?' on':'');
if(k)s.style.background=C[k];else s.textContent='پاک';
s.onclick=function(){cur=k;pal();};
p.appendChild(s);
});
}
document.getElementById('chk').onclick=function(){
var wrong={},bad=0,empty=0;
for(var r=0;r<4;r++)for(var i=0;i<N;i++){
if(st[r][i]==='')empty++;
else if(st[r][i]!==exp(r,i)){wrong[r+'_'+i]=1;bad++;}
}
var m=document.getElementById('msg');
if(bad){m.textContent=bad+' خانه اشتباه است. دوباره الگو را نگاه کن.';m.style.color='var(--bad)';}
else if(empty){m.textContent='تا اینجا درست است. ردیف‌ها را کامل کن.';m.style.color='var(--warn)';}
else{m.textContent='آفرین! همه الگوها درست است. حالا ردیف آخر را خودت طراحی کن.';m.style.color='var(--ok)';}
draw(wrong);
};
document.getElementById('rst').onclick=init;
pal();init();
</script>
</body>
</html>
