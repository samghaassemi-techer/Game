<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>باغ انار – بازی حرف‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b1a2a;--red:#ff3d57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{margin:0;min-height:100%;color-scheme:light}
body{font-family:'Vazirmatn',Tahoma,sans-serif;color:var(--ink);overflow-x:hidden;min-height:100vh;background:linear-gradient(180deg,#1fb0ff 0%,#7fe3ff 50%,#ffe58a 100%) 0 0/100% 200%;animation:sky 14s ease-in-out infinite alternate}
@keyframes sky{to{background-position:0 100%}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg>*{position:absolute}
.sun{top:2%;left:3%;width:120px}
.spin{animation:spin 24s linear infinite;transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
.rb{top:12%;right:1%;width:min(46vw,230px);opacity:.85}
.cl{animation:drift 50s linear infinite;width:96px}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 140px))}}
.hills{bottom:0;left:0;width:100%;height:36vh}
#trees{bottom:9vh;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end}
.tree{width:min(32vw,160px);height:auto;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}
.tree:nth-child(2n){animation-delay:-2.2s}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.pm{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}
.fl{bottom:1vh;font-size:30px;animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
.cr{font-size:32px;animation:fly 24s linear infinite}
@keyframes fly{0%{transform:translate(-12vw,0)}25%{transform:translate(25vw,-40px) rotate(8deg)}50%{transform:translate(55vw,24px)}75%{transform:translate(82vw,-34px) rotate(-8deg)}100%{transform:translate(112vw,10px)}}
.pt{top:-30px;animation:petal linear infinite}
@keyframes petal{to{transform:translate(50px,110vh) rotate(540deg)}}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:14px 14px 120px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:900}
.pill{background:#ff3d57;color:#fff;border:4px solid var(--ink);border-radius:20px;padding:2px 16px;box-shadow:0 4px 0 var(--ink);min-height:40px;display:flex;align-items:center}
.pill.y{background:#ffd93b;color:var(--ink);font-size:18px}
.bar{height:16px;background:#fff;border:4px solid var(--ink);border-radius:12px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ff3d57 0 10px,#ff7a8c 10px 20px);transition:width .5s}
.panel{background:rgba(255,255,255,.86);border:4px solid var(--ink);border-radius:32px;padding:16px 12px 20px;box-shadow:0 8px 0 rgba(59,26,42,.45)}
h1{font-size:28px;font-weight:900;margin:4px 0;text-shadow:0 3px 0 #fff}
.q{font-size:19px;font-weight:700;margin:6px 0 12px}
.pic{background:#fff;border:4px solid var(--ink);border-radius:28px;padding:10px 24px;display:inline-flex;flex-direction:column;align-items:center;box-shadow:0 6px 0 var(--ink);animation:pop .5s;min-width:170px}
.pic .w{font-size:34px;font-weight:900}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-8px) rotate(-3deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.opt{font:900 38px 'Vazirmatn',Tahoma,sans-serif;min-width:92px;padding:8px 18px;border:4px solid var(--ink);border-radius:22px;background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer}
.opt:nth-child(1){background:#ffd166}.opt:nth-child(2){background:#7bdff2}.opt:nth-child(3){background:#ffadc9}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.opt:focus-visible,.btn:focus-visible{outline:4px solid #7a4cff}
.opt.ok{background:#8df0b0;animation:jump .5s}
.opt.bad{background:#ff9a9d;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes jump{50%{transform:translateY(-14px) scale(1.1)}}
.word{display:flex;gap:8px;justify-content:center;margin-top:14px}
.part{font-size:40px;font-weight:900;min-width:78px;padding:4px 12px;border:4px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 5px 0 var(--ink)}
.part.blank{border-style:dashed;color:var(--red);background:#fff4c2}
.fb{min-height:34px;font-size:20px;font-weight:900;margin-top:14px}
.btn{font:900 22px 'Vazirmatn',Tahoma,sans-serif;background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:24px;padding:10px 32px;box-shadow:0 6px 0 var(--ink);cursor:pointer;margin-top:14px}
.sky{width:100%;max-width:340px;height:auto;overflow:visible}
.fall{animation:fall 1.6s cubic-bezier(.3,1.4,.5,1) both}
.fall.b{animation-delay:.35s}
.float{animation:flt 3s ease-in-out infinite}
@keyframes fall{from{transform:translateY(-340px)}to{transform:translateY(0)}}
@keyframes flt{50%{transform:translateY(-6px)}}
.bu{position:fixed;z-index:9;font-size:26px;pointer-events:none;animation:bu 1.1s ease-out forwards}
@keyframes bu{to{transform:translate(var(--dx),var(--dy)) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <div class="top"><span class="pill" id="stage">باغ انار</span><span class="pill y" id="stars">⭐ ۰</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="panel" id="game"></div>
</main>
<script>
const ink='#3b1a2a',K=`stroke="${ink}" stroke-width="4"`;
const fc=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="-8" cy="-2" r="3" fill="${ink}"/><circle cx="8" cy="-2" r="3" fill="${ink}"/><circle cx="-7" cy="-3" r="1" fill="#fff"/><circle cx="9" cy="-3" r="1" fill="#fff"/><path d="M-6 5Q0 12 6 5" stroke="${ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="-14" cy="5" r="3.5" fill="#ff8fa3" opacity=".7"/><circle cx="14" cy="5" r="3.5" fill="#ff8fa3" opacity=".7"/></g>`;
const IMG={
pom:`<circle cx="50" cy="60" r="36" fill="#ff3d57" ${K}/><ellipse cx="34" cy="46" rx="6" ry="10" fill="#fff" opacity=".4" transform="rotate(25 34 46)"/><path d="M30 30L36 10L45 24L50 6L55 24L64 10L70 30Z" fill="#e0243e" ${K}/>${fc(50,66,1.3)}`,
leaf:`<path d="M50 6C92 30 92 76 50 94C8 76 8 30 50 6Z" fill="#4cc35f" ${K}/><path d="M50 20V94" stroke="${ink}" stroke-width="3"/>${fc(50,52,1.1)}`,
cloud:`<path d="M24 76Q6 76 8 60Q10 46 28 50Q32 30 52 32Q70 30 74 48Q94 46 94 62Q94 76 76 76Z" fill="#fff" ${K}/>${fc(51,60,1.2)}`,
basket:`<path d="M24 50Q50 -6 76 50" fill="none" stroke="#8a5528" stroke-width="8" stroke-linecap="round"/><path d="M10 48H90L80 92H20Z" fill="#e8a24a" ${K}/><path d="M18 64H82M22 78H78M38 48L41 92M62 48L59 92" stroke="#b9722a" stroke-width="3"/>`,
boy:`<path d="M22 98Q24 78 50 78Q76 78 78 98Z" fill="#3b82f6" ${K}/><circle cx="50" cy="48" r="28" fill="#ffcf9f" ${K}/><path d="M22 46Q20 14 50 16Q80 14 78 46Q64 30 50 34Q36 30 22 46Z" fill="#4a2a1a" ${K}/>${fc(50,56,1.2)}`,
brow:`<ellipse cx="50" cy="64" rx="36" ry="22" fill="#fff" ${K}/><circle cx="50" cy="64" r="14" fill="#8a4b1f"/><circle cx="50" cy="64" r="6" fill="${ink}"/><circle cx="45" cy="58" r="3" fill="#fff"/><path d="M10 38Q50 6 90 36" stroke="#4a2a1a" stroke-width="12" fill="none" stroke-linecap="round"/>`,
corn:`<path d="M50 94Q18 88 16 48Q34 62 50 94Z" fill="#4cc35f" ${K}/><path d="M50 94Q82 88 84 48Q66 62 50 94Z" fill="#4cc35f" ${K}/><path d="M50 4Q78 28 72 70Q64 94 50 94Q36 94 28 70Q22 28 50 4Z" fill="#ffd93b" ${K}/><path d="M38 28H62M34 44H66M32 60H68M36 76H64M50 12V90M42 20V88M58 20V88" stroke="#e8a900" stroke-width="2.5"/>`};
const ic=(k,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" stroke-linejoin="round" class="bounce">${IMG[k]}</svg>`;
// ---------- background ----------
const tp=(x,y,i)=>`<g class="pm" style="animation-delay:${-i*.5}s"><circle cx="${x}" cy="${y}" r="10" fill="#ff3d57" stroke="${ink}" stroke-width="2.5"/><path d="M${x-5} ${y-9}l2-5 3 4 3-4 2 5z" fill="#e0243e" stroke="${ink}" stroke-width="1.5"/><circle cx="${x-3.5}" cy="${y-1}" r="1.4" fill="${ink}"/><circle cx="${x+3.5}" cy="${y-1}" r="1.4" fill="${ink}"/><path d="M${x-3} ${y+3}Q${x} ${y+6} ${x+3} ${y+3}" stroke="${ink}" stroke-width="1.4" fill="none"/></g>`;
const tree=()=>{const c=[[65,62,46],[32,84,28],[98,84,28]];return `<svg class="tree" viewBox="0 0 130 190"><rect x="56" y="100" width="18" height="90" rx="6" fill="#a0622d" stroke="${ink}" stroke-width="3.5"/>${c.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]+3.5}" fill="${ink}"/>`).join('')}${c.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="${a[2]}" fill="#3ccf5e"/>`).join('')}<path d="M40 40Q55 28 70 34M20 78Q28 68 40 70" stroke="#7bef8c" stroke-width="4" fill="none" stroke-linecap="round"/>${[[38,72],[74,46],[96,88],[56,96],[22,94]].map((a,i)=>tp(a[0],a[1],i)).join('')}</svg>`};
const sun=`<svg class="sun" viewBox="-60 -60 120 120"><g class="spin">${[...Array(12).keys()].map(i=>`<path d="M-5 -42L0 -58L5 -42Z" fill="#ffb703" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round" transform="rotate(${i*30})"/>`).join('')}</g><circle r="34" fill="#ffd93b" stroke="${ink}" stroke-width="4"/>${fc(0,2,1.4)}</svg>`;
const rb=`<svg class="rb" viewBox="0 0 200 100">${['#ff4d6d','#ff9f1c','#ffe14d','#4cd964','#35b7ff','#a46bff'].map((c,i)=>`<path d="M${10+i*8} 100A${90-i*8} ${90-i*8} 0 0 1 ${190-i*8} 100" stroke="${c}" stroke-width="8" fill="none"/>`).join('')}</svg>`;
const cl=(t,d,w)=>`<svg class="cl" style="top:${t}%;animation-delay:${d}s;width:${w}px" viewBox="0 0 100 100">${IMG.cloud}</svg>`;
const hills=`<svg class="hills" viewBox="0 0 800 300" preserveAspectRatio="none"><path d="M0 110Q150 30 300 100T600 80T800 96V300H0Z" fill="#8ae89a" stroke="${ink}" stroke-width="4" vector-effect="non-scaling-stroke"/><path d="M0 170Q200 90 400 160T800 140V300H0Z" fill="#4fcf6b" stroke="${ink}" stroke-width="4" vector-effect="non-scaling-stroke"/><path d="M0 230Q220 170 450 225T800 205V300H0Z" fill="#2fb456" stroke="${ink}" stroke-width="4" vector-effect="non-scaling-stroke"/></svg>`;
let bg=sun+rb+cl(6,-5,90)+cl(20,-25,70)+cl(32,-40,100)+hills+`<div id="trees" style="position:absolute">${tree()+tree()+tree()+tree()}</div>`;
['🌸','🌼','🌷','🌻','🌺','🌼','🌷','🌸'].forEach((f,i)=>bg+=`<span class="fl" style="left:${i*13+2}%;animation-delay:${-i*.4}s">${f}</span>`);
[['🦋',34,0],['🐦',12,-9],['🐝',46,-14],['🦋',24,-18]].forEach(a=>bg+=`<span class="cr" style="top:${a[1]}%;animation-delay:${a[2]}s;animation-duration:${20+Math.abs(a[2])}s">${a[0]}</span>`);
for(let i=0;i<14;i++)bg+=`<span class="pt" style="left:${Math.random()*95}%;font-size:${14+Math.random()*12}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s">🌸</span>`;
document.getElementById('bg').innerHTML=bg;
// ---------- game ----------
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const S=[
 {n:'مرحله ۱: پیدا کن',q:[{img:'pom',w:'اَنار',ans:'اَ'},{img:'leaf',w:'بَرگ',ans:'ـَ'},{img:'cloud',w:'اَبر',ans:'اَ'},{img:'basket',w:'سَبَد',ans:'ـَ'},{img:'boy',w:'اَمین',ans:'اَ'}]},
 {n:'مرحله ۲: کامل کن',q:[{img:'brow',a:'اَبـ',b:'رو',o:['اَ','آب','اَبـ']},{img:'pom',a:'اَ',b:'نار',o:['آ','اَ','ب']},{img:'corn',a:'بَـ',b:'لال',o:['اَبـ','بَـ','با']}]},
 {n:'مرحله ۳: بادکنک‌ها',q:[{x:'بـ',y:'ا',ans:'با',o:['با','بَـ','اَبـ']},{x:'بـ',y:'ـَ',ans:'بَـ',o:['با','بَـ','آب']},{x:'آ',y:'ب',ans:'آب',o:['آب','با','اَبـ']}]}
];
let st=0,qi=0,stars=0,lock=false;
const $=id=>document.getElementById(id);
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=['🎉','⭐','✨','🍎'][i%4];s.className='bu';s.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;--dx:${(Math.random()-.5)*300}px;--dy:${-Math.random()*220-30}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}
function bar(){const t=S.reduce((a,s)=>a+s.q.length,0);const d=S.slice(0,st).reduce((a,s)=>a+s.q.length,0)+qi;$('bar').style.width=d/t*100+'%';if(S[st])$('stage').textContent=S[st].n;$('stars').textContent='⭐ '+fa(stars)}
const opts=l=>`<div class="opts">${shuf(l).map(o=>`<button class="opt" data-v="${o}">${o}</button>`).join('')}</div><div class="fb" id="fb" aria-live="polite"></div>`;
function wire(ans,onOk){document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(lock)return;
 if(b.dataset.v===ans){lock=true;b.classList.add('ok');stars++;$('stars').textContent='⭐ '+fa(stars);burst(b);$('fb').textContent=['آفرین! 🎉','عالی بود! 🌟','درست گفتی! 🍎'][qi%3];$('fb').style.color='#1c8a4a';onOk&&onOk();setTimeout(()=>{lock=false;qi++;next()},1400)}
 else{b.classList.add('bad');$('fb').textContent='دوباره امتحان کن 💪';$('fb').style.color='#d92d3a';setTimeout(()=>b.classList.remove('bad'),450)}})}
const balloon=(x,l,c,d)=>`<g class="fall ${d}"><g class="float"><path d="M${x} 118L170 200" stroke="${ink}" stroke-width="3"/><ellipse cx="${x}" cy="62" rx="44" ry="50" fill="${c}" stroke="${ink}" stroke-width="4"/><path d="M${x-6} 112h12l-6 10z" fill="${c}" stroke="${ink}" stroke-width="3" stroke-linejoin="round"/><ellipse cx="${x-18}" cy="40" rx="8" ry="14" fill="#fff" opacity=".45" transform="rotate(20 ${x-18} 40)"/><text x="${x}" y="82" text-anchor="middle" font-size="54" font-weight="900" fill="#fff" stroke="${ink}" stroke-width="6" style="paint-order:stroke" font-family="Vazirmatn,Tahoma">${l}</text></g></g>`;
const basketSvg=`<path d="M120 205H220L208 246H132Z" fill="#e8a24a" stroke="${ink}" stroke-width="4" stroke-linejoin="round"/><path d="M130 222H210M134 235H206" stroke="#b9722a" stroke-width="3"/>`;
function next(){bar();const s=S[st];
 if(!s)return end();
 if(qi>=s.q.length){st++;qi=0;if(st>=S.length)return end();return inter()}
 const q=s.q[qi],g=$('game');
 if(st==0){g.innerHTML=`<div class="q">در این تصویر کدام شکل وجود دارد؟</div><div class="pic">${ic(q.img,100)}<div class="w">${q.w}</div></div>`+opts(['اَ','ـَ']);wire(q.ans)}
 else if(st==1){g.innerHTML=`<div class="q">تصویر را بخوان و جای خالی را پر کن</div><div class="pic">${ic(q.img,110)}</div><div class="word"><div class="part blank" id="bl">؟</div><div class="part">${q.b}</div></div>`+opts(q.o);wire(q.a,()=>{const e=$('bl');e.textContent=q.a;e.classList.remove('blank')})}
 else{g.innerHTML=`<div class="q">اگر این دو را با هم ترکیب کنی چه می‌شود؟</div><svg class="sky" viewBox="0 0 340 256">${balloon(250,q.x,'#ff4d6d','a')}${balloon(90,q.y,'#35a7ff','b')}${basketSvg}</svg>`+opts(q.o);wire(q.ans)}
}
function inter(){bar();$('game').innerHTML=`<h1>آفرین! مرحله تمام شد 🎊</h1>${ic('pom',110)}<br><button class="btn" id="go">برویم مرحله بعد</button>`;$('go').onclick=next}
function end(){$('bar').style.width='100%';$('game').innerHTML=`<h1>تو قهرمان باغ انار شدی! 🏆</h1>${ic('pom',110)}<div class="q">${fa(stars)} ستاره جمع کردی ⭐</div><button class="btn" id="re">دوباره بازی کن</button>`;$('re').onclick=()=>{st=0;qi=0;stars=0;next()}}
$('game').innerHTML=`<h1>باغ انار 🌳</h1>${ic('pom',120)}<div class="q">سه مرحله بازی با حرف‌ها و صداها</div><button class="btn" id="start">شروع بازی</button>`;
$('start').onclick=next;
</script>
</body>
</html>
