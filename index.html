<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول را کامل کن – پایه اول</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap">
<style>
:root{--bg:#f3f8ff;--ink:#1d2b53;--or:#e8772e;--ok:#22b573;--sun:#ffc533;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a33;--ink:#f1f5ff}}
:root[data-theme="dark"]{--bg:#121a33;--ink:#f1f5ff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:900;margin:6px 0 12px;text-align:center}
.lv{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.lv button,.next{font:inherit;font-weight:700;border:3px solid var(--ink);background:#fff;color:#1d2b53;border-radius:12px;padding:6px 14px;cursor:pointer}
.lv button.on{background:var(--sun)}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.tbl{display:grid;direction:ltr;border:3px solid var(--or);background:#fff;width:min(100%,var(--w))}
.tbl>*{aspect-ratio:1;border:2px solid var(--or);background:#fff;padding:4px;margin:0;font:inherit;min-width:0}
.tbl svg,.opts svg{width:100%;height:100%;display:block}
.corner{background:var(--or)!important}
.cell.empty{border:3px dashed var(--or);cursor:pointer}
.cell.sel{box-shadow:inset 0 0 0 4px var(--sun);background:#fff8dc}
.cell.solved{background:#e6f8ef}
.cell.bad{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{margin:14px 0 8px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:480px}
.opts button{width:84px;height:84px;padding:4px;background:#fff;border:3px solid var(--ink);border-radius:14px;cursor:pointer}
.win{display:none;margin-top:14px;text-align:center;font-weight:900;font-size:1.3rem}
.win.show{display:block}
.next{background:var(--sun);margin-top:8px;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){.cell.bad{animation:none}}
</style>
</head>
<body>
<h1>مانند نمونه، جدول را کامل کن</h1>
<div class="lv" id="lv" role="group" aria-label="مرحله‌ها"></div>
<div class="tbl" id="tbl"></div>
<div class="hint" id="hint">خانهٔ خالی را ببین و تصویر درست را انتخاب کن.</div>
<div class="opts" id="opts"></div>
<div class="win" id="win"><div>آفرین! جدول کامل شد ⭐</div><button class="next" id="next">مرحلهٔ بعد</button></div>
<script>
const P={
roofB:'<polygon points="14,46 50,14 86,46" fill="#3aa0f0"/>',
roofR:'<polygon points="14,46 50,14 86,46" fill="#e5383b"/>',
house:'<rect x="26" y="46" width="48" height="42" fill="#fff" stroke="#555" stroke-width="2"/><rect x="34" y="60" width="14" height="28" fill="#f4c20d" stroke="#555"/><rect x="56" y="56" width="12" height="12" fill="#fff" stroke="#555"/><path d="M62 56v12M56 62h12" stroke="#555"/>',
shirtY:'<polygon points="30,14 42,10 58,10 70,14 88,32 78,42 69,35 69,56 31,56 31,35 22,42 12,32" fill="#f4c20d" stroke="#b8860b"/>',
shirtG:'<polygon points="30,14 42,10 58,10 70,14 88,32 78,42 69,35 69,56 31,56 31,35 22,42 12,32" fill="#43b04a" stroke="#2d7d33"/>',
pantsR:'<polygon points="32,54 68,54 72,94 55,94 50,70 45,94 28,94" fill="#e5383b" stroke="#a4161a"/>',
pantsB:'<polygon points="32,54 68,54 72,94 55,94 50,70 45,94 28,94" fill="#2f7fe0" stroke="#1d4f99"/>',
star:'<polygon points="50,8 57,24 74,25 61,36 65,52 50,43 35,52 39,36 26,25 43,24" fill="#f4c20d" stroke="#d99a00"/>',
moon:'<path d="M60 8a22 22 0 1 0 0 40a17 17 0 1 1 0-40z" fill="#f4c20d" stroke="#d99a00"/>',
sun:'<g stroke="#f4a100" stroke-width="3" stroke-linecap="round"><path d="M50 4v7M50 45v7M26 28h-7M81 28h-7M33 11l4 4M67 11l-4 4M33 45l4-4M67 45l-4-4"/></g><circle cx="50" cy="28" r="13" fill="#ffc533"/>',
mountain:'<polygon points="4,92 28,58 52,92" fill="#e2c4ac" stroke="#b08968"/><polygon points="48,92 72,58 96,92" fill="#e2c4ac" stroke="#b08968"/>',
tree:'<rect x="46" y="66" width="8" height="26" fill="#8a5a2b"/><circle cx="38" cy="62" r="13" fill="#4caf50"/><circle cx="62" cy="62" r="13" fill="#4caf50"/><circle cx="50" cy="52" r="14" fill="#4caf50"/>',
appleR:'<path d="M50 34C30 22 12 40 18 62C24 86 44 90 50 84C56 90 76 86 82 62C88 40 70 22 50 34z" fill="#e5383b" stroke="#a4161a" stroke-width="2"/>',
appleY:'<path d="M50 34C30 22 12 40 18 62C24 86 44 90 50 84C56 90 76 86 82 62C88 40 70 22 50 34z" fill="#f4c20d" stroke="#b8860b" stroke-width="2"/>',
leaf:'<path d="M50 34C48 12 66 6 80 8C80 26 68 36 50 34z" fill="#4caf50" stroke="#2d7d33" stroke-width="2"/>'};
const car=(f,s)=>'<rect x="12" y="52" width="76" height="28" rx="6" fill="'+f+'" stroke="'+s+'" stroke-width="2"/><rect x="28" y="38" width="44" height="18" rx="5" fill="'+f+'" stroke="'+s+'" stroke-width="2"/><rect x="34" y="42" width="14" height="11" fill="#cfe8ff"/><rect x="52" y="42" width="14" height="11" fill="#cfe8ff"/>';
const pet=(f,s)=>'<g fill="'+f+'" stroke="'+s+'"><circle cx="50" cy="12" r="9"/><circle cx="65" cy="24" r="9"/><circle cx="35" cy="24" r="9"/><circle cx="59" cy="38" r="9"/><circle cx="41" cy="38" r="9"/></g><circle cx="50" cy="27" r="8" fill="#8a5a2b"/>';
const scoop=(f,s)=>'<circle cx="50" cy="38" r="18" fill="'+f+'" stroke="'+s+'" stroke-width="2"/>';
const hat=f=>'<polygon points="50,6 32,40 68,40" fill="'+f+'" stroke="#555" stroke-width="2"/><circle cx="50" cy="8" r="4" fill="#ffc533"/>';
const face=(f,s)=>'<circle cx="50" cy="66" r="26" fill="'+f+'" stroke="'+s+'" stroke-width="2"/><circle cx="41" cy="62" r="3" fill="#333"/><circle cx="59" cy="62" r="3" fill="#333"/><path d="M40 74Q50 84 60 74" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>';
Object.assign(P,{
carR:car('#e5383b','#a4161a'),carB:car('#2f7fe0','#1d4f99'),
wheels:'<circle cx="32" cy="82" r="9" fill="#333"/><circle cx="68" cy="82" r="9" fill="#333"/>',
flag:'<line x1="50" y1="12" x2="50" y2="40" stroke="#555" stroke-width="3"/><polygon points="50,12 76,20 50,28" fill="#ffc533" stroke="#d99a00"/>',
petalR:pet('#e5383b','#a4161a'),petalY:pet('#f4c20d','#b8860b'),petalP:pet('#9b59d0','#6c3a99'),
stem:'<path d="M50 46V92" stroke="#2e8b3a" stroke-width="5"/><path d="M50 76C36 76 30 66 28 60C42 60 48 66 50 76z" fill="#4caf50"/><path d="M50 68C64 68 70 58 72 52C58 52 52 58 50 68z" fill="#4caf50"/>',
cone:'<polygon points="30,52 70,52 50,94" fill="#e0a458" stroke="#a9742a" stroke-width="2"/><path d="M38 58l12 24M62 58L50 82" stroke="#a9742a" stroke-width="1.5"/>',
cup:'<polygon points="26,52 74,52 66,92 34,92" fill="#cfe8ff" stroke="#5a8fc4" stroke-width="2"/>',
scoopP:scoop('#ff9ec4','#d6628f'),scoopB:scoop('#8a5a2b','#5a3a1b'),
hatR:hat('#e5383b'),hatB:hat('#2f7fe0'),
faceA:face('#ffd9b3','#c98f5b'),faceB:face('#c68642','#8d5524')});
const svg=(...k)=>'<svg viewBox="0 0 100 100" aria-hidden="true">'+k.map(x=>P[x]).join('')+'</svg>';
const arrow='<svg viewBox="0 0 100 100"><path d="M18 84Q22 30 74 24" fill="none" stroke="#ffc533" stroke-width="7" stroke-dasharray="1 11" stroke-linecap="round"/><polygon points="72,12 94,24 72,38" fill="#e5383b"/></svg>';
const L=[
{n:"خانه",top:["roofB","roofR"],left:["house"]},
{n:"لباس",top:["shirtY","shirtG"],left:["pantsR","pantsB"]},
{n:"آسمان",top:["star","moon","sun"],left:["mountain","tree"]},
{n:"سیب",top:["leaf"],left:["appleR","appleY"]},
{n:"ماشین",top:["wheels","flag"],left:["carR","carB"]},
{n:"گل",top:["petalR","petalY","petalP"],left:["stem"]},
{n:"بستنی",top:["scoopP","scoopB"],left:["cone","cup"]},
{n:"شب و روز",top:["sun","moon"],left:["house","tree"]},
{n:"کلاه",top:["hatR","hatB"],left:["faceA","faceB"]}];
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let lv=0,done,sel,lock;
const $=id=>document.getElementById(id);
function build(i){
  lv=i;const d=L[i];lock=false;
  done=d.left.map((_,r)=>d.top.map((_,c)=>r===0&&c===0));
  $("lv").innerHTML="";
  L.forEach((x,j)=>{const b=document.createElement("button");b.textContent=fa(j+1);b.setAttribute("aria-label","مرحلهٔ "+fa(j+1));b.className=j===i?"on":"";b.onclick=()=>build(j);$("lv").appendChild(b)});
  $("win").classList.remove("show");$("hint").style.display="";
  const cols=d.top.length+1;
  const t=$("tbl");t.style.gridTemplateColumns="repeat("+cols+",minmax(0,1fr))";t.style.setProperty("--w",cols*110+"px");
  const opts=[];
  d.left.forEach((_,r)=>{d.top.forEach((_,c)=>opts.push([r,c]));opts.push([r,-1])});
  $("opts").innerHTML="";
  shuffle(opts).forEach(([r,c])=>{const b=document.createElement("button");b.innerHTML=c<0?svg(d.left[r]):svg(d.left[r],d.top[c]);b.setAttribute("aria-label","گزینه");b.onclick=()=>pick(r,c);$("opts").appendChild(b)});
  nextEmpty();draw();
}
function nextEmpty(){const d=L[lv];sel=null;for(let r=0;r<d.left.length&&!sel;r++)for(let c=0;c<d.top.length;c++)if(!done[r][c]){sel=[r,c];break}}
function draw(){
  const d=L[lv],t=$("tbl");t.innerHTML='<div class="corner">'+arrow+'</div>';
  d.top.forEach(k=>{const e=document.createElement("div");e.innerHTML=svg(k);t.appendChild(e)});
  d.left.forEach((k,r)=>{
    const e=document.createElement("div");e.innerHTML=svg(k);t.appendChild(e);
    d.top.forEach((tk,c)=>{
      const b=document.createElement("button");b.id="c"+r+"_"+c;
      const ok=done[r][c];
      b.className="cell"+(ok?(r===0&&c===0?"":" solved"):" empty")+(sel&&sel[0]===r&&sel[1]===c?" sel":"");
      b.innerHTML=ok?svg(k===undefined?"":d.left[r],tk):"";
      b.setAttribute("aria-label",ok?"خانهٔ پر":"خانهٔ خالی");
      b.onclick=()=>{if(!ok&&!lock){sel=[r,c];draw()}};
      t.appendChild(b);
    });
  });
}
function pick(r,c){
  if(!sel||lock)return;
  const [sr,sc]=sel;
  if(r===sr&&c===sc){
    done[sr][sc]=true;nextEmpty();draw();
    if(!sel){lock=true;$("hint").style.display="none";$("win").classList.add("show");$("next").textContent=lv<L.length-1?"مرحلهٔ بعد":"از اول شروع کن"}
  }else{
    const e=$("c"+sr+"_"+sc);e.classList.remove("bad");void e.offsetWidth;e.classList.add("bad");
  }
}
$("next").onclick=()=>build(lv<L.length-1?lv+1:0);
build(0);
</script>
</body>
</html>
