<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماجرای آ و ا</title>
<style>
:root{--bg:#14123a;--card:#241f5c;--text:#fff;--muted:#b9b5e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.wrap{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative}
.hud{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:17px;font-weight:700}
.hud span{background:rgba(255,255,255,.1);border-radius:14px;padding:4px 12px}
#msg{position:absolute;top:52px;left:0;right:0;text-align:center;font-size:17px;font-weight:700;pointer-events:none;transition:opacity .4s;opacity:0;padding:0 14px}
canvas{flex:1;width:100%;touch-action:none;display:block}
.ov{position:absolute;inset:0;background:rgba(10,8,40,.88);display:flex;align-items:center;justify-content:center;padding:22px;text-align:center}
.ov .box{background:var(--card);border-radius:26px;padding:26px 22px;max-width:340px}
.ov h1{margin:0 0 6px;font-size:26px}
.ov p{color:var(--muted);line-height:1.9;margin:8px 0;font-size:15px}
.ov button{margin-top:12px;border:0;border-radius:18px;padding:14px 38px;font:inherit;font-size:20px;font-weight:700;background:#f59f00;color:#2b1d00;cursor:pointer}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud"><span>⭐ <b id="sc">۰</b></span><span id="lvl">مرحله ۱</span><span id="lv">❤️❤️❤️</span></div>
  <div id="msg"></div>
  <canvas id="c"></canvas>
  <div class="ov" id="ov"><div class="box">
    <h1>✨ ماجرای آ و ا</h1>
    <p>۱۲ کارت تصویری (بدون تکرار) از آسمون می‌افتن! اسم زیر تصویر رو بخون و پایین‌ترین‌شون رو بفرست به دوست درست:</p>
    <p><b style="color:#ff922b">آ اول</b> ← سمت راست<br><b style="color:#4dabf7">ا غیر اول</b> ← سمت چپ</p>
    <p>روی نصف راست یا چپ صفحه بزن. ۵ جواب درست پشت‌سرهم، زمان رو کند می‌کنه!</p>
    <button id="go">شروع</button>
  </div></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$("c"),ctx=cv.getContext("2d");
const A=[["آب","💧"],["آش","🍲"],["آهو","🦌"],["آینه","🪞"],["آفتاب","☀️"],["آتش","🔥"],["آبشار","🏞️"],["آشپز","👨‍🍳"],["آجیل","🥜"],["آبمیوه","🧃"],["آدم‌برفی","⛄"],["آسمان","🌌"]];
const N=[["نان","🍞"],["ماه","🌙"],["کتاب","📚"],["باران","🌧️"],["ماهی","🐟"],["گاو","🐄"],["باغ","🌳"],["پا","🦶"],["دریا","🌊"],["سالاد","🥗"],["ساعت","⏰"],["خانه","🏠"],["کاغذ","📄"],["ماشین","🚗"],["قایق","⛵"],["بادکنک","🎈"],["جارو","🧹"]];
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
let W,H,dpr,run=false,deck=[],sc,lives,combo,lvl,corr,words,fx,parts,spawn,slow,shake,bounce={A:0,N:0},eat={A:0,N:0},lastW="",best=0,prev=0,tm=0,msgT;
try{best=+localStorage.getItem("alefBest")||0}catch(e){}
const stars=Array.from({length:45},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.4,p:Math.random()*6}));
function rs(){dpr=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",rs);
let ac;function beep(f,d=.12,ty="sine"){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function say(t,col){const m=$("msg");m.textContent=t;m.style.color=col||"#fff";m.style.opacity=1;clearTimeout(msgT);msgT=setTimeout(()=>m.style.opacity=0,2200)}
function hud(){$("sc").textContent=fa(sc);$("lvl").textContent="کارت "+fa(12-deck.length-words.length)+" از ۱۲";$("lv").textContent="❤️".repeat(Math.max(lives,0))+"🖤".repeat(Math.max(3-lives,0))}
function start(){sc=0;lives=3;combo=0;lvl=1;corr=0;words=[];fx=[];parts=[];spawn=.4;slow=0;shake=0;lastW="";deck=buildDeck();run=true;$("ov").classList.add("hide");hud();say("آماده باش!")}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDeck(){return shuf(shuf(A).slice(0,6).map(p=>({p,isA:true})).concat(shuf(N).slice(0,6).map(p=>({p,isA:false}))))}
function mk(){const c=deck.pop(),p=c.p,isA=c.isA;
  return{w:p[0],e:p[1],isA,x:W*.22+Math.random()*W*.56,y:-70,ph:Math.random()*6}}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:.8,c:col})}}
function floorY(){return H-190}
function lose(w,why){lives--;combo=0;shake=.35;beep(150,.3,"sawtooth");
  say(why+(w.isA?"«"+w.w+"» با «آ» شروع می‌شه":"«"+w.w+"» «ا» داره ولی اولش نیست"),"#ff8787");
  burst(w.x,floorY(),"#ff6b6b",16);hud();if(lives<=0)over()}
function answer(side){if(!run)return;
  let a=null;for(const w of words)if(!a||w.y>a.y)a=w;if(!a)return;
  words.splice(words.indexOf(a),1);
  const ok=(side==="A")===a.isA,tx=side==="A"?W*.75:W*.25;
  fx.push({w:a.w,e:a.e,x:a.x,y:a.y,tx,ty:H-85,t:0,ok});eat[side]=.35;
  if(ok){combo++;const pts=10*(1+Math.floor(combo/5));sc+=pts;corr++;bounce[side]=.4;beep(520+combo*25,.12,"triangle");
    burst(tx,H-110,side==="A"?"#ffa94d":"#74c0fc",14);say(combo>=3?"🔥 "+fa(combo)+" پشت‌سرهم! +"+fa(pts):"آفرین! +"+fa(pts),"#8ce99a");
    if(combo%5===0){slow=4;say("⭐ زمان کند شد!","#ffd43b");beep(880,.3)}
    if(corr%4===0){lvl++;say("🚀 مرحله "+fa(lvl)+"!","#ffd43b");beep(700,.4)}
    hud()}
  else lose(a,"اشتباه شد! ")}
function over(){run=false;try{if(sc>best){best=sc;localStorage.setItem("alefBest",best)}}catch(e){}
  const o=$("ov");o.classList.remove("hide");
  o.innerHTML='<div class="box"><h1>بازی تموم شد</h1><p>امتیاز تو: <b>'+fa(sc)+'</b><br>بهترین امتیاز: <b>'+fa(Math.max(best,sc))+'</b><br>رسیدی به مرحلهٔ '+fa(lvl)+'</p><button id="go2">دوباره</button></div>';
  $("go2").onclick=start}
function win(){run=false;try{if(sc>best){best=sc;localStorage.setItem("alefBest",best)}}catch(e){}beep(784,.2);setTimeout(()=>beep(988,.3),200);
  const o=$("ov");o.classList.remove("hide");
  o.innerHTML='<div class="box"><h1>🎉 آفرین!</h1><p>هر ۱۲ کارت رو تموم کردی<br>امتیاز: <b>'+fa(sc)+'</b><br>بهترین امتیاز: <b>'+fa(Math.max(best,sc))+'</b><br>'+"⭐".repeat(lives)+'</p><button id="go3">دوباره</button></div>';$("go3").onclick=start}
function update(dt){
  const k=slow>0?.4:1;slow=Math.max(0,slow-dt);shake=Math.max(0,shake-dt);
  for(const s of["A","N"]){bounce[s]=Math.max(0,bounce[s]-dt);eat[s]=Math.max(0,eat[s]-dt)}
  spawn-=dt*(slow>0?.6:1);if(spawn<=0&&deck.length){words.push(mk());spawn=Math.max(.9,2.3-lvl*.18)}
  if(!deck.length&&!words.length&&run&&lives>0){win();return}
  const v=(55+lvl*14)*k;
  for(let i=words.length-1;i>=0;i--){const w=words[i];w.y+=v*dt;w.ph+=dt*3;
    if(w.y>floorY()){words.splice(i,1);lose(w,"دیر شد! ")}}
  for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t+=dt*3.2;if(f.t>=1)fx.splice(i,1)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt;if(p.l<=0)parts.splice(i,1)}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function card(o,x,y,active,alpha){const w=o.w;ctx.save();ctx.globalAlpha=alpha==null?1:alpha;
  const cw=Math.max(116,w.length*20+44);
  rr(x-cw/2,y-62,cw,124,22);ctx.fillStyle="#fff";ctx.fill();
  if(active){ctx.lineWidth=5;ctx.strokeStyle="#ffd43b";ctx.stroke()}
  ctx.fillStyle="#2b2160";ctx.font="700 26px Vazirmatn,Tahoma,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.direction="rtl";ctx.fillText(w,x,y+40);ctx.font="58px serif";ctx.fillText(o.e,x,y-16);ctx.restore()}
function chr(x,col,letter,hat,b,e,label){const y=H-85-Math.sin(b*Math.PI/.4)*28;
  ctx.save();ctx.translate(x,y);
  ctx.beginPath();ctx.ellipse(0,0,50,46,0,0,6.28);ctx.fillStyle=col;ctx.fill();
  ctx.fillStyle="#fff";for(const ex of[-17,17]){ctx.beginPath();ctx.arc(ex,-14,10,0,6.28);ctx.fill()}
  ctx.fillStyle="#222";for(const ex of[-17,17]){ctx.beginPath();ctx.arc(ex,-13,4.5,0,6.28);ctx.fill()}
  ctx.beginPath();if(e>0){ctx.ellipse(0,8,14,12,0,0,6.28);ctx.fillStyle="#5c1a1a";ctx.fill()}
  else{ctx.arc(0,4,13,.15*Math.PI,.85*Math.PI);ctx.lineWidth=4;ctx.strokeStyle="#222";ctx.stroke()}
  ctx.fillStyle="#fff";ctx.font="700 26px Tahoma,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(letter,0,32);
  if(hat){ctx.font="52px serif";ctx.fillText("🎩",0,-52)}
  ctx.restore();
  ctx.fillStyle="rgba(255,255,255,.75)";ctx.font="700 14px Vazirmatn,Tahoma,sans-serif";ctx.textAlign="center";ctx.fillText(label,x,H-24)}
function draw(){
  const h=(210+lvl*35)%360,g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"hsl("+h+",55%,14%)");g.addColorStop(1,"hsl("+h+",55%,30%)");
  ctx.save();ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
  for(const s of stars){ctx.globalAlpha=.4+.5*Math.abs(Math.sin(tm+s.p));ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.28);ctx.fill()}
  ctx.globalAlpha=1;
  if(slow>0){ctx.fillStyle="rgba(255,212,59,.12)";ctx.fillRect(0,0,W,H)}
  ctx.setLineDash([8,8]);ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,floorY());ctx.lineTo(W,floorY());ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="rgba(255,255,255,.06)";ctx.fillRect(W/2-1,floorY(),2,H);
  let a=null;for(const w of words)if(!a||w.y>a.y)a=w;
  for(const w of words)card(w,w.x+Math.sin(w.ph)*8,w.y,w===a);
  for(const f of fx){const t=f.t,x=f.x+(f.tx-f.x)*t,y=f.y+(f.ty-f.y)*t;card(f,x,y,false,1-t*.8)}
  chr(W*.25,"#339af0","ا",false,bounce.N,eat.N,"ا غیر اول");
  chr(W*.75,"#f76707","آ",false,bounce.A,eat.A,"آ اول");
  for(const p of parts){ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill()}
  ctx.restore()}
function loop(ts){const dt=Math.min((ts-prev)/1000,.05);prev=ts;tm+=dt;if(run)update(dt);draw();requestAnimationFrame(loop)}
cv.addEventListener("pointerdown",e=>{const r=cv.getBoundingClientRect();answer(e.clientX-r.left>r.width/2?"A":"N")});
addEventListener("keydown",e=>{if(e.key==="ArrowRight")answer("A");if(e.key==="ArrowLeft")answer("N")});
$("go").onclick=start;
rs();sc=0;lives=3;lvl=1;words=[];fx=[];parts=[];slow=0;shake=0;requestAnimationFrame(t=>{prev=t;loop(t)});
</script>
</body>
</html>
