<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی هم‌آغاز</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8f6ff;--card:#fff;--ink:#2b2b3a;--c:#4a90e2;--ok:#2fb86b;--bad:#e5484d;--line:#c5d3e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2233;--card:#27304a;--ink:#f1f4ff;--line:#55618a}}
html{height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:22px;margin:4px 0 2px;font-weight:900}
.sub{font-size:14px;opacity:.8;margin-bottom:10px;text-align:center}
.bar{display:flex;gap:6px;margin-bottom:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--c)}.dot.done{background:var(--ok)}
.card{background:var(--card);border-radius:28px;padding:18px 14px;width:100%;max-width:440px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.pic{font-size:100px;line-height:1.1;animation:pop .4s}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.word{font-size:40px;font-weight:900;margin:2px 0}
.say{border:0;background:none;font-size:28px;cursor:pointer}
.q{font-size:18px;font-weight:700;margin:10px 0 8px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:4px solid var(--line);border-radius:20px;background:transparent;color:var(--ink);padding:10px 2px;cursor:pointer;font-family:inherit;transition:.15s}
.opt .e{font-size:48px;display:block}
.opt .t{font-size:18px;font-weight:700}
.opt.ok{border-color:var(--ok);background:rgba(47,184,107,.2);transform:scale(1.06)}
.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.18)}
.msg{min-height:34px;font-size:20px;font-weight:700;margin:10px 0 4px}
button.b{font-family:inherit;font-size:18px;font-weight:700;border:0;border-radius:16px;padding:12px 26px;cursor:pointer;color:#fff;background:var(--c)}
</style>
</head>
<body>
<h1>🔤 کدام هم‌آغاز است؟</h1>
<div class="sub">کلمه بالا را بگو. کدام تصویر پایین با آن شروع یکسان دارد؟</div>
<div class="bar" id="bar"></div>
<div class="card">
  <div class="pic" id="pic"></div>
  <div class="word" id="word"></div>
  <button class="say" id="say" aria-label="بخوان">🔊</button>
  <div class="q" id="q">روی تصویر درست بزن 👇</div>
  <div class="opts" id="opts"></div>
  <div class="msg" id="msg"></div>
  <button class="b" id="next" style="display:none">بعدی ➡️</button>
</div>
<script>
const R=[
 {w:'آب',e:'💧',o:[['کتاب','📖'],['کیف','🎒'],['آبی','🔵']],a:'آبی',s:'آ'},
 {w:'کتاب',e:'📖',o:[['کیف','🎒'],['مدرسه','🏫'],['مدیر','👨‍💼']],a:'کیف',s:'ک'},
 {w:'مدرسه',e:'🏫',o:[['ماشین','🚗'],['آب','💧'],['کتاب','📖']],a:'ماشین',s:'م'}
];
let i=0,score=0,done=false;
const $=id=>document.getElementById(id);
function bar(){$('bar').innerHTML=R.map((_,k)=>`<div class="dot ${k<i?'done':k==i?'on':''}"></div>`).join('')}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';u.rate=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
$('say').onclick=()=>speak(R[i].w);
function show(){
  done=false;const r=R[i];
  $('pic').textContent=r.e;$('pic').style.animation='none';void $('pic').offsetWidth;$('pic').style.animation='';
  $('word').textContent=r.w;$('msg').textContent='';$('next').style.display='none';
  $('q').style.display='';$('opts').style.display='';
  $('opts').innerHTML='';
  r.o.forEach(([t,e])=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<span class="e">${e}</span><span class="t">${t}</span>`;
    b.onclick=()=>{
      if(done)return;
      if(t===r.a){
        done=true;score++;b.classList.add('ok');
        $('msg').textContent='آفرین! 🎉 هر دو با «'+r.s+'» شروع می‌شوند';
        $('next').style.display='';
        $('next').textContent=i===R.length-1?'پایان 🏁':'بعدی ➡️';
      }else{
        b.classList.add('bad');$('msg').textContent='دوباره فکر کن 🙂';
      }
    };
    $('opts').appendChild(b);
  });
  bar();
}
$('next').onclick=()=>{
  if(i<R.length-1){i++;show()}
  else if(i===R.length-1){
    i=R.length;bar();
    $('pic').textContent='🏆';$('word').textContent='آفرین!';
    $('q').style.display='none';$('opts').style.display='none';
    $('msg').textContent='همه را پیدا کردی!';
    $('next').textContent='دوباره 🔁';
  }else{location.reload()}
};
show();
</script>
</body>
</html>
