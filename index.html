<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی قطار کلمه‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#bfe8ff;overflow:hidden;color:#3a2a14;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;background:linear-gradient(#8fd3ff 0%,#d9f3ff 45%,#fff 46%)}
.sun{position:absolute;top:70px;left:6%;font-size:64px;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;font-size:60px;animation:drift 50s linear infinite;opacity:.95}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.hill{position:absolute;bottom:0;left:-10%;width:120%;height:58%;background:radial-gradient(ellipse at 30% 0,#7fd462 0 60%,transparent 61%),radial-gradient(ellipse at 80% 10%,#5cc24a 0 55%,transparent 56%),linear-gradient(#5cc24a,#3fa83a)}
.ground{position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(#4fb840,#2f9a31)}
.deco{position:absolute;font-size:44px;animation:sway 4s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(6deg)}}
.rail{position:absolute;left:0;right:0;bottom:21%;height:10px;background:repeating-linear-gradient(90deg,#8a5a2b 0 10px,#6b431d 10px 14px);border-top:4px solid #777}
#top{position:relative;z-index:5;padding:10px 14px;text-align:center}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
#tabs button{font:inherit;font-weight:800;border:0;border-radius:20px;padding:8px 14px;background:#fff;color:#2b6cb0;box-shadow:0 3px 0 #9cc7ee;cursor:pointer}
#tabs button.on{background:#ff8a3d;color:#fff;box-shadow:0 3px 0 #c75f1a}
#q{background:#fffbe6;border:3px solid #ffd54a;border-radius:18px;padding:10px 14px;font-weight:800;font-size:clamp(15px,3.6vw,22px);line-height:1.8;max-width:760px;margin:auto}
#stage{position:absolute;left:0;right:0;bottom:0;top:0}
.train{position:absolute;bottom:calc(21% + 8px);left:0;display:flex;flex-direction:row-reverse;direction:ltr;align-items:flex-end;width:max-content;animation:go 26s linear infinite;z-index:3}

@keyframes go{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
.engine{font-size:92px;line-height:1;margin-left:-6px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.wagon{direction:rtl;position:relative;width:clamp(105px,22vw,150px);min-height:clamp(70px,14vw,90px);margin-left:8px;background:#ff6b6b;border:4px solid #c0392b;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(18px,4.2vw,28px);color:#fff;cursor:pointer;box-shadow:0 6px 0 #8e2a1f;padding:4px}
.wagon:nth-child(2n){background:#4dabf7;border-color:#1c7ed6;box-shadow:0 6px 0 #14589a}
.wagon:nth-child(3n){background:#ffb020;border-color:#d98c00;box-shadow:0 6px 0 #9a6200}
.wagon::before,.wagon::after{content:"";position:absolute;bottom:-16px;width:22px;height:22px;border-radius:50%;background:#333;border:4px solid #bbb}
.wagon::before{left:14px}.wagon::after{right:14px}
.wagon .n{position:absolute;top:-12px;right:-6px;background:#fff;color:#444;border-radius:50%;width:24px;height:24px;font-size:13px;display:grid;place-items:center}
.wagon.ok{background:#37c95b!important;border-color:#1e8f3b!important;animation:pop .5s}
.wagon.ok::after{content:"⭐";background:none;border:0;width:auto;height:auto;font-size:26px;bottom:auto;top:-18px;left:-6px;right:auto}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.2) rotate(-4deg)}}
#ctl{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:0;right:0;text-align:center;z-index:6;display:flex;gap:10px;justify-content:center;align-items:center}
#ctl button,.btn{font:inherit;font-weight:800;border:0;border-radius:20px;padding:10px 18px;background:#fff;color:#2b6cb0;box-shadow:0 3px 0 #9cc7ee;cursor:pointer;font-size:16px}
#score{background:#fff;border-radius:20px;padding:8px 16px;font-weight:800;font-size:18px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:#fff;border:5px solid #ffd54a;border-radius:28px;padding:20px 30px;text-align:center;font-weight:800;font-size:clamp(22px,6vw,38px);display:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#msg .btn{margin-top:12px;background:#ff8a3d;color:#fff;box-shadow:0 3px 0 #c75f1a}
#quiz{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:150px 14px 20px}
#card{background:#fff;border:5px solid #ffd54a;border-radius:28px;padding:14px 26px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12)}
#emo{font-size:clamp(70px,20vw,120px);line-height:1.1}
#word{font-weight:800;font-size:clamp(34px,10vw,60px);display:flex;justify-content:center;align-items:center;gap:2px;min-height:1.4em}
.gap{display:inline-flex;min-width:1.1em;height:1.2em;border:4px dashed #ff8a3d;border-radius:12px;align-items:center;justify-content:center;margin:0 4px;color:#1e8f3b}
.gap.f{border:4px solid #37c95b;background:#e5ffe9}
#opts{display:flex;gap:18px}
.opt{width:clamp(110px,32vw,150px);background:#fff;border:5px solid #4dabf7;border-radius:24px;padding:10px;text-align:center;font-weight:800;cursor:pointer;box-shadow:0 7px 0 #14589a}
.opt b{display:block;font-size:clamp(54px,16vw,80px);line-height:1.3;color:#d9480f}
.opt small{font-size:15px;color:#555}
#prog{font-weight:800;background:#fff;border-radius:16px;padding:4px 14px}
.conf{position:fixed;width:10px;height:14px;z-index:30;pointer-events:none;border-radius:2px}
#app.autumn{background:linear-gradient(#ffb36b,#ffe3b0 55%,#d9a05b 56%)}
.autumn .sun,.autumn .cloud,.autumn .hill,.autumn .ground,.autumn .deco,.autumn .rail{display:none}
.au{display:none;position:absolute;z-index:1}.autumn .au{display:block}
.augr{left:0;right:0;bottom:0;height:30%;background:linear-gradient(#c98a3d,#8a5a2b)}
.leaf{position:absolute;z-index:2;font-size:28px;pointer-events:none;top:-40px}
#house{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;gap:10px;padding:150px 14px 20px;overflow:auto}
.home{position:relative;width:min(88vw,340px)}
.roof{position:relative;z-index:1;height:110px;background:#8b2e1f;clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:38px;color:#fff;font-weight:800}
.chim{position:absolute;top:8px;right:20%;width:30px;height:56px;background:#a63a28;border-top:8px solid #fff}
.hbody{background:#fff3d6;border:5px solid #5a2d1a;padding:4px}
.lbl{font-size:14px;font-weight:800;color:#8b2e1f;text-align:right}
.rw{display:flex;margin-bottom:4px}
.tbl{display:grid;direction:rtl;gap:4px;background:#5a2d1a;border:4px solid #5a2d1a}.bx{min-height:60px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800}
.bx.f{background:#e5ffe9;color:#1e8f3b}
.bx.next{background:#ffe2b8;box-shadow:inset 0 0 0 4px #ff8a3d;animation:blink .8s infinite alternate}
@keyframes blink{to{background:#ffd9a8}}
#hint{font-weight:800;background:#fff;border-radius:16px;padding:4px 14px}
#bank{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.cd{min-width:70px;text-align:center;padding:6px 16px;border:4px solid #4dabf7;border-radius:18px;background:#fff;font-weight:800;font-size:34px;cursor:pointer;box-shadow:0 5px 0 #14589a}
</style>
</head>
<body>
<div id="app">
  <div class="sun">☀️</div>
  <div class="cloud" style="top:40px;animation-delay:-10s">☁️</div>
  <div class="cloud" style="top:110px;animation-delay:-35s;font-size:44px">☁️</div>
  <div class="hill"></div><div class="ground"></div>
  <div class="deco" style="bottom:50%;left:4%;font-size:70px">🌳</div>
  <div class="deco" style="bottom:48%;left:24%">🌲</div>
  <div class="deco" style="bottom:52%;left:52%;font-size:66px">🌳</div>
  <div class="deco" style="bottom:47%;left:76%">🍎</div>
  <div class="deco" style="bottom:50%;right:3%;font-size:70px">🌳</div>
  <div class="deco" style="bottom:8%;left:8%">🌷</div>
  <div class="deco" style="bottom:6%;left:30%">🌼</div>
  <div class="deco" style="bottom:9%;left:58%">🌻</div>
  <div class="deco" style="bottom:5%;right:12%">🌷</div>
  <div class="deco" style="bottom:36%;left:40%;animation-duration:2s">🦋</div>
  <div class="rail"></div>

  <div id="top">
    <div id="tabs">
      <button class="on" data-g="train">🚂 قطار کلمه‌ها</button>
      <button data-g="a">آ / ا</button>
      <button data-g="b">ب</button>
      <button data-g="h">🍂 بخش و صدا</button>
    </div>
    <div id="q"></div>
  </div>

  <div class="au augr"></div><div class="au" style="bottom:22%;left:2%;font-size:90px;filter:hue-rotate(-95deg) saturate(2.2)">🌳</div><div class="au" style="bottom:20%;right:3%;font-size:100px;filter:hue-rotate(-75deg) saturate(2.2)">🌳</div><div class="au" style="bottom:4%;left:20%;font-size:40px">🍄</div><div class="au" style="bottom:5%;right:22%;font-size:44px">🎃</div>
  <div id="stage"></div>
  <div id="house"></div>
  <div id="quiz">
    <div id="prog"></div>
    <div id="card"><div id="emo"></div><div id="word"></div></div>
    <div id="opts"></div>
  </div>
  <div id="ctl"><span id="score"></span></div>
  <div id="msg"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const WORDS=[["آدم برفی",0],["آب",1],["بابا",1],["مدرسه",0],["آبا",1],["مدیر",0],["باب",1]];
const GOOD=WORDS.filter(w=>w[1]).length;
const Q={
 a:{t:"عزیزم! حرف جا افتاده را پیدا کن: «آ» اول کلمه است یا «ا» غیر اول؟",
  opts:[["آ","اول"],["ا","غیر اول"]],
  items:[["⛄","","دم برفی",0,"آ"],["🌙","مـ","ه",1,"ا"],["💧","","ب",0,"آ"],["🐄","گـ","و",1,"ا"],["🦌","","هو",0,"آ"],["🌬️","بـ","د",1,"ا"]]},
 b:{t:"عزیزم! حرف جا افتاده را پیدا کن: «ب» غیر آخر است یا «ب» آخر؟",
  opts:[["بـ","غیر آخر"],["ـب","آخر"]],
  items:[["🎈","","ادکنک",0,"ب"],["🍎","سیـ","",1,"ب"],["🍦","","ـستنی",0,"ب"],["📖","کتا","",1,"ب"],["🌧️","","اران",0,"ب"],["💧","آ","",1,"ب"],["🐐","","ـز",0,"ب"],["👄","لـ","",1,"ب"]]}
};
let ac;
function snd(f,d=.15,t="sine"){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function yay(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.2),i*110))}
function boom(x,y,n=28){const c=["#ff6b6b","#ffd54a","#4dabf7","#37c95b","#ff8a3d","#e599f7"];
 for(let i=0;i<n;i++){const e=document.createElement("div");e.className="conf";e.style.background=c[i%c.length];e.style.left=x+"px";e.style.top=y+"px";document.body.appendChild(e);
  const a=Math.random()*6.28,r=60+Math.random()*140;
  e.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r+120}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1100+Math.random()*600,easing:"ease-out"}).onfinish=()=>e.remove()}}
function rain(){for(let i=0;i<5;i++)setTimeout(()=>boom(innerWidth*(.1+Math.random()*.8),-10,40),i*250)}
function msg(html){const m=$("#msg");m.innerHTML=html;m.style.display="block"}
function hideMsg(){$("#msg").style.display="none"}

/* ---- Game 1: train ---- */
let found=0;
function startTrain(){
 hideMsg();found=0;
 $("#q").textContent="عزیزم! کلماتی که می‌توانی بخوانی و بنویسی را در هر واگن پیدا کن و روی آن بزن.";
 $("#quiz").style.display="none";$("#stage").style.display="block";$("#ctl").style.display="flex";
 $("#score").textContent="⭐ ۰ از "+GOOD.toLocaleString("fa");
 const st=$("#stage");
 st.innerHTML='<div class="train" id="tr"><div class="engine">🚂</div></div>';
 const tr=$("#tr");
 WORDS.forEach((w,i)=>{const d=document.createElement("div");d.className="wagon";d.innerHTML=w[0]+'<span class="n">'+(i+1).toLocaleString("fa")+'</span>';
  d.onclick=e=>{
   if(d.classList.contains("ok"))return;
   if(w[1]){d.classList.add("ok");found++;snd(660);yay();boom(e.clientX,e.clientY);
    $("#score").textContent="⭐ "+found.toLocaleString("fa")+" از "+GOOD.toLocaleString("fa");
    if(found===GOOD){rain();setTimeout(()=>msg('🎉 آفرین! همه را پیدا کردی! 🎉<br><button class="btn" onclick="go(\'a\')">بازی بعدی ◀</button>'),700)}}
   else{d.classList.remove("shake");void d.offsetWidth;d.classList.add("shake");snd(200,.25,"triangle")}
  };tr.appendChild(d)});
}


/* ---- Games 2 & 3: letter quiz ---- */
let cur,idx,order;
function startQuiz(k){
 hideMsg();cur=Q[k];idx=0;
 order=cur.items.map(x=>x).sort(()=>Math.random()-.5);
 $("#q").textContent=cur.t;
 $("#stage").style.display="none";$("#ctl").style.display="none";$("#quiz").style.display="flex";
 const o=$("#opts");o.innerHTML="";
 cur.opts.forEach((p,i)=>{const d=document.createElement("div");d.className="opt";d.innerHTML="<b>"+p[0]+"</b><small>"+p[1]+"</small>";d.onclick=e=>pick(i,d,e);o.appendChild(d)});
 show(k);
}
let lock=false,key;
function show(k){key=k;lock=false;const it=order[idx];
 $("#prog").textContent="مرحله "+(idx+1).toLocaleString("fa")+" از "+order.length.toLocaleString("fa");
 $("#emo").textContent=it[0];
 $("#word").innerHTML='<span>'+it[1]+'</span><span class="gap" id="gp">؟</span><span>'+it[2]+'</span>';
}
function pick(i,el,e){
 if(lock)return;const it=order[idx];
 if(i===it[3]){lock=true;$("#word").innerHTML='<span style="color:#1e8f3b">'+it[1].replace(/ـ$/,"")+it[4]+it[2].replace(/^ـ/,"")+'</span>';snd(660);yay();boom(e.clientX,e.clientY);
  setTimeout(()=>{idx++;if(idx<order.length)show(key);else{rain();msg(key==="a"?'🎉 آفرین! 🎉<br><button class="btn" onclick="go(\'b\')">مرحله بعد (ب) ◀</button>':'🏆 عالی بود! همه را درست زدی! 🏆<br><button class="btn" onclick="go(\'train\')">بازگشت به قطار</button> <button class="btn" onclick="go(\'h\')">بخش و صدا ◀</button>')}},1300);
 }else{el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");snd(200,.25,"triangle")}
}

const H=[["بابا",[["با",["ب","ا"]],["با",["ب","ا"]]]],["آب",[["آب",["آ","ب"]]]],["با",[["با",["ب","ا"]]]],["آبا",[["آ",["آ"]],["با",["ب","ا"]]]],["باب",[["باب",["ب","ا","ب"]]]]];
function sy(h){return h[1].map(x=>x[0])}
function sn(h){const f=h[1].flatMap(x=>x[1]);return f.map((s,i)=>s==="ب"&&i<f.length-1?"بـ":s)}
const SYL=["با","آب","باب","آ","ما"],SND=["آ","ا","د","م"];
let hi,hs,hp,hlock;
function startHouse(){hideMsg();hi=0;hlock=false;
 $("#q").textContent="عزیزم! کلمه را بخش کن و صداکشی کرده، در خانه‌ها بنویس.";
 $("#stage").style.display="none";$("#ctl").style.display="none";$("#quiz").style.display="none";$("#house").style.display="flex";hshow()}
function hshow(){hs=0;hp=0;const h=H[hi];
 let si=0,vj=0;const N=sn(h).length;const cells=h[1].map(x=>'<div class="bx" id="s'+(si++)+'" style="grid-column:span '+x[1].length+'"></div>').join("")+sn(h).map(()=>'<div class="bx" id="v'+(vj++)+'"></div>').join("");
 $("#house").innerHTML='<div id="prog">خانه '+(hi+1).toLocaleString("fa")+' از '+H.length.toLocaleString("fa")+'</div><div class="home"><div class="chim"></div><div class="roof">'+h[0]+'</div><div class="tbl" style="grid-template-columns:repeat('+N+',1fr)">'+cells+'</div></div><div id="hint"></div><div id="bank"></div>';
 hbank()}
function hbank(){const h=H[hi],tgt=hs?sn(h):sy(h);
 $("#hint").textContent=hs?"🔊 صداکشی کن: صداها را به ترتیب بزن":"✂️ بخش کن: بخش‌ها را به ترتیب بزن";
 let pool=[...new Set(tgt)];const dis=(hs?SND.concat(pool.includes("بـ")?["ب"]:pool.includes("ب")?["بـ"]:[]):SYL).filter(x=>!pool.includes(x)).sort(()=>Math.random()-.5).slice(0,2);
 pool=pool.concat(dis).sort(()=>Math.random()-.5);
 const b=$("#bank");b.innerHTML="";pool.forEach(t=>{const c=document.createElement("div");c.className="cd";c.textContent=t;c.onclick=e=>hpick(t,c,e);b.appendChild(c)});mark()}
function mark(){document.querySelectorAll(".bx").forEach(b=>b.classList.remove("next"));const b=$("#"+(hs?"v":"s")+hp);if(b)b.classList.add("next")}
function hpick(t,c,e){if(hlock)return;const h=H[hi],tgt=hs?sn(h):sy(h),id=hs?"v":"s";
 if(t===tgt[hp]){const b=$("#"+id+hp);b.textContent=t;b.classList.add("f");snd(660);boom(e.clientX,e.clientY,14);hp++;
  if(hp>=tgt.length){if(!hs){hs=1;hp=0;yay();setTimeout(hbank,500)}else{hlock=true;yay();boom(innerWidth/2,300,50);setTimeout(()=>{hlock=false;hi++;if(hi<H.length)hshow();else{rain();msg('🍁 آفرین! همه خانه‌ها کامل شد! 🍁<br><button class="btn" onclick="go(\'train\')">بازگشت به قطار</button>')}},1400)}}else mark()
 }else{c.classList.remove("shake");void c.offsetWidth;c.classList.add("shake");snd(200,.25,"triangle")}}
setInterval(()=>{if(!$("#app").classList.contains("autumn"))return;const l=document.createElement("div");l.className="leaf";l.textContent=Math.random()<.5?"🍂":"🍁";l.style.left=Math.random()*95+"%";$("#app").appendChild(l);const dx=(Math.random()-.5)*160;l.animate([{transform:"translate(0,0) rotate(0)"},{transform:`translate(${dx}px,${innerHeight+60}px) rotate(${Math.random()*540}deg)`}],{duration:6000+Math.random()*4000,easing:"ease-in-out"}).onfinish=()=>l.remove()},450);
function go(g){
 $("#app").classList.toggle("autumn",g==="h");$("#house").style.display="none";
 document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.g===g));
 g==="train"?startTrain():g==="h"?startHouse():startQuiz(g);
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>go(b.dataset.g));
go("train");
</script>
</body>
</html>
