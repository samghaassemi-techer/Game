<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بازی حرف س</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--sky1:#5ec8ff;--sky2:#c9f1ff;--card:#fffdf5;--ink:#3a2a5a;--pri:#ff7a3d;--ok:#2fb35a;--bad:#e5484d;--line:#ffb84d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#1b1650;--sky2:#4a3a8c}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:linear-gradient(var(--sky1),var(--sky2));color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;text-align:center;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;font-size:46px}
.c{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(120vw)}to{transform:translateX(-30vw)}}
.st{animation:tw 2s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.bl{animation:rise linear infinite;bottom:-60px}
@keyframes rise{to{transform:translateY(-115vh) rotate(15deg)}}
.sun{top:6px;left:10px;font-size:64px;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hill{position:absolute;bottom:-40px;left:-10%;width:120%;height:130px;background:#5cc96b;border-radius:50% 50% 0 0}
.h2{bottom:-60px;left:-30%;width:110%;height:150px;background:#47b85a}
.h3{bottom:-30px;left:20%;width:110%;height:170px;background:#7ddc7a}
.rb{position:absolute;top:70px;right:-70px;width:360px;height:180px;opacity:.8;background:radial-gradient(circle at 50% 100%,transparent 52%,#a855f7 52% 58%,#3d8bff 58% 64%,#2fb35a 64% 70%,#ffd23d 70% 76%,#ff7a3d 76% 82%,#ff4d6d 82% 88%,transparent 88%)}
.sw{animation:sway 3s ease-in-out infinite;transform-origin:bottom}
@keyframes sway{50%{transform:rotate(7deg)}}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:5;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#ff7a3d;font-size:22px;cursor:pointer}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:28px;margin:8px 0}
.bar{display:flex;gap:6px;margin:6px 0 12px}
.bar i{flex:1;height:12px;border-radius:8px;background:#fff8;border:2px solid #fff}
.bar i.on{background:var(--pri)}
.q{font-size:19px;font-weight:700;margin:8px 0}
.box{background:var(--card);border:4px solid var(--line);border-radius:26px;padding:14px;margin:10px 0;box-shadow:0 6px 0 #0002}
.tile{display:inline-block;min-width:54px;padding:6px 12px;margin:4px;border-radius:16px;background:#ffe08a;color:#3b2b00;font-size:38px;font-weight:900;border:3px solid #e6a800;animation:bob 2s ease-in-out infinite}
.tile:nth-child(2n){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.btn{font:inherit;font-size:28px;font-weight:900;padding:10px 16px;border-radius:22px;border:4px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-width:92px;box-shadow:0 5px 0 #0002;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.btn small{font-size:15px;font-weight:700}
.btn:active{transform:translateY(3px)}
.btn.go{background:var(--pri);border-color:#d85a1f;color:#fff;font-size:24px;display:inline-block;padding:12px 34px}
.btn.ok{background:var(--ok);border-color:#1d8a42;color:#fff}
.btn.bad{background:var(--bad);border-color:#b32d32;color:#fff;animation:sh .3s}
.btn[disabled]{opacity:.4}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pic{width:84px;height:84px;margin:0 auto;font-size:64px;line-height:84px;animation:hop 1.6s ease-in-out infinite}
.pic svg{width:100%;height:100%}
.btn .pic{width:56px;height:56px;font-size:42px;line-height:56px;animation:none}
@keyframes hop{50%{transform:translateY(-8px) scale(1.06)}}
.word{font-size:46px;font-weight:900}
.blank{display:inline-block;min-width:44px;border-bottom:5px dashed var(--pri)}
.house{max-width:420px;margin:8px auto}
.roof{height:56px;background:#e5484d;clip-path:polygon(50% 0,100% 100%,0 100%)}
.fl{display:flex;align-items:center;gap:8px;background:var(--card);border:4px solid #b9803a;border-top-width:0;padding:8px;min-height:84px}
.fl.act{background:#fff3c4}
.fl b{width:54px;color:var(--pri);font-size:17px}
.slots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{min-width:56px;height:62px;border:3px dashed var(--pri);border-radius:14px;font-size:32px;font-weight:900;line-height:56px;padding:0 6px;background:#fff}
.slot.f{border-style:solid;border-color:#1d8a42;background:var(--ok);color:#fff}
.slot.bad{animation:sh .3s;border-color:var(--bad)}
.stars{font-size:34px;min-height:44px}
.msg{min-height:32px;font-size:21px;font-weight:700;color:#127a38}
.pop{animation:pp .5s}
@keyframes pp{50%{transform:scale(1.25)}}
</style></head><body>
<div class="bg"><span class="sun">☀️</span>
<span class="c" style="top:9%;animation-duration:45s">☁️</span><span class="c" style="top:24%;animation-duration:60s;animation-delay:-20s">☁️</span><span class="c" style="top:40%;animation-duration:50s;animation-delay:-35s">☁️</span>
<span class="st" style="top:15%;right:12%">⭐</span><span class="st" style="top:33%;left:8%;animation-delay:.7s">✨</span><span class="st" style="top:55%;right:6%;animation-delay:1.2s">✨</span>
<span class="bl" style="left:10%;animation-duration:16s">🎈</span><span class="bl" style="left:70%;animation-duration:22s;animation-delay:-9s">🎈</span><span class="bl" style="left:40%;animation-duration:19s;animation-delay:-4s">🦋</span>
<div class="rb"></div><span class="c" style="top:18%;animation-duration:30s;font-size:30px">🐦</span><span class="c" style="top:30%;animation-duration:38s;animation-delay:-12s;font-size:26px">🕊️</span><div class="hill h3"></div><div class="hill h2"></div><div class="hill"></div><span class="sw" style="bottom:70px;left:6%">🌳</span><span class="sw" style="bottom:50px;left:30%;font-size:34px">🌷</span><span class="sw" style="bottom:60px;right:28%;font-size:34px">🌼</span><span class="sw" style="bottom:66px;right:6%">🌴</span><span class="sw" style="bottom:20px;left:48%;font-size:30px">🐞</span></div>
<button id="mu" onclick="tog()">🔊</button>

function step(){const t=ac.currentTime+.05;note(M[ni%16],t,.4,'triangle',.5);if(ni%2==0)note(B[(ni/2)%8],t,.6,'sine',.6);if(ni%4==2)note(M[ni%16]*1.5,t,.2,'sine',.15);ni++}
function mus(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.12;mg.connect(ac.destination)}if(ac.state=='suspended')ac.resume();if(mt&&!tm)tm=setInterval(step,330)}catch(e){}}
function tog(){mt=!mt;if(!mt){clearInterval(tm);tm=null}else mus();document.getElementById('mu').textContent=mt?'🔊':'🔇'}
document.addEventListener('pointerdown',mus);
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInterval(tm);tm=null}else if(mt&&ac)mus()});
start();
</script></body></html>
